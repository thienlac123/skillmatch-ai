services:
  postgres:
    image: postgres:16
    container_name: skillmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillmatch
      POSTGRES_USER: skillmatch
      POSTGRES_PASSWORD: skillmatch_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmatch -d skillmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: skillmatch-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://skillmatch:skillmatch_password@postgres:5432/skillmatch
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: